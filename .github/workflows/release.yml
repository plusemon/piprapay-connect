name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on git tags like v1.0.0, v1.0.1, v2.0.0
  release:
    types: [published] # Triggers when a release is created in GitHub Releases UI
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_notes:
        description: 'Release highlights or description'
        required: false
        default: 'Production release of PipraPay Connect Android app.'
      is_draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref_type != 'tag' && github.event_name != 'push' }}
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag & Name
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="PipraPay Connect ${TAG}"
            BODY="${{ github.event.inputs.release_notes }}"
            DRAFT="${{ github.event.inputs.is_draft }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name || format('PipraPay Connect {0}', github.event.release.tag_name) }}"
            BODY="${{ github.event.release.body }}"
            DRAFT="false"
          else
            TAG="${{ github.ref_name }}"
            NAME="PipraPay Connect ${TAG}"
            BODY="Release ${TAG}"
            DRAFT="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Determined release: tag=${TAG}, name=${NAME}"

      - name: Setup Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/release.keystore"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/release.keystore" >> "$GITHUB_ENV"
          elif [ -f "debug.keystore.base64" ]; then
            echo "Restoring debug keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          elif [ -f "debug.keystore" ]; then
            echo "Using existing debug.keystore..."
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          else
            echo "Generating fallback signing keystore..."
            keytool -genkeypair -v -keystore "${GITHUB_WORKSPACE}/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=PipraPay,O=PipraPay,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/debug.keystore" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || env.STORE_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEY_ALIAS || 'androiddebugkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || env.KEY_PASSWORD || 'android' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Stage Release APK
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          mkdir -p release-assets

          echo "Listing all generated APK files:"
          find app/build/outputs/apk/ -type f || true

          RELEASE_APK=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          else
            RELEASE_APK=$(find app/build/outputs/apk/ -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$RELEASE_APK" ] || [ ! -f "$RELEASE_APK" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/"
            exit 1
          fi

          echo "Selected Release APK: $RELEASE_APK"
          cp "$RELEASE_APK" "release-assets/piprapay-connect-${TAG}.apk"
          echo "Successfully packaged: release-assets/piprapay-connect-${TAG}.apk"
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ steps.release_meta.outputs.body }}
          generate_release_notes: true
          draft: ${{ steps.release_meta.outputs.draft == 'true' }}
          prerelease: false
          files: release-assets/piprapay-connect-${{ steps.release_meta.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

