name: Build APK on New Tag

on:
  push:
    tags:
      - 'v*' # Triggers on v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK
        # Replace assembleDebug with assembleRelease if release keystore is configured
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK with Tag Version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/piprapay-companion-${{ github.ref_name }}.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "PipraPay Companion ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/piprapay-companion-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
