name: Build and Publish Release APK

on:
  push:
    tags:
      - 'v*' # Triggers on git tags like v1.0.0, v1.0.1, v2.0.0
  release:
    types: [published] # Triggers when a release is created in GitHub Releases UI
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_notes:
        description: 'Release highlights or description'
        required: false
        default: 'Production release of PipraPay Companion Android app.'
      is_draft:
        description: 'Create as draft release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Determine Release Tag & Name
        id: release_meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            NAME="PipraPay Companion ${TAG}"
            BODY="${{ github.event.inputs.release_notes }}"
            DRAFT="${{ github.event.inputs.is_draft }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            NAME="${{ github.event.release.name || format('PipraPay Companion {0}', github.event.release.tag_name) }}"
            BODY="${{ github.event.release.body }}"
            DRAFT="false"
          else
            TAG="${{ github.ref_name }}"
            NAME="PipraPay Companion ${TAG}"
            BODY="Release ${TAG}"
            DRAFT="false"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "body=${BODY}" >> "$GITHUB_OUTPUT"
          echo "draft=${DRAFT}" >> "$GITHUB_OUTPUT"
          echo "Determined release: tag=${TAG}, name=${NAME}"

      - name: Restore Debug Keystore if available
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi

      - name: Build APK
        run: ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Stage Release APK
        run: |
          TAG="${{ steps.release_meta.outputs.tag }}"
          mkdir -p release-assets
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/piprapay-companion-${TAG}.apk"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/piprapay-companion-${TAG}.apk"
          fi
          echo "Packaged APK: release-assets/piprapay-companion-${TAG}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.name }}
          body: ${{ steps.release_meta.outputs.body }}
          generate_release_notes: true
          draft: ${{ steps.release_meta.outputs.draft == 'true' }}
          prerelease: false
          files: release-assets/piprapay-companion-${{ steps.release_meta.outputs.tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
